<div class="flex justify-center">
    <div class="p-6 flex flex-col gap-3 !text-[var(--color-black-alt)] botonApariencia bg-white">
        <div class="flex flex-col pt-2 px-4 justify-center items-center">
            <span class="text-[26px]">Administración de SCAM</span>
            <span>Seleccionar una Unidad Operativa</span>
            <span class="my-2 py-0">
                <app-btn class="botonApariencia flex" type="submit" color="mezclado">
                    Programar Taller
                </app-btn>
            </span>
        </div>
        <div class="flex flex-col gap-2.5 bg-[#F4F5F7] py-4 px-3">
            <ng-container *ngIf="listUnidOperativa == undefined">
                <div class="text-gray-600 w-full text-center">
                    <p class="py-1 font-bold text-2xl">
                        <fa-icon class="mr-2" [icon]="faSpinner" [pulse]="true"></fa-icon>
                        Obteniendo datos...
                    </p>
                </div>
            </ng-container>
            <ng-container *ngIf="listUnidOperativa != undefined">
                <ng-container *ngIf="listUnidOperativa.length > 0  ">
                    <div class="px-3 py-2 flex flex-row bg-white justify-between w-[676px] items-center"
                        *ngFor="let unidOp of listUnidOperativa, index as i">
                        <div class="py-2 flex flex-row gap-2.5 items-center">
                            <img class="select-none" *ngIf="unidOp.unidOperativa.split(' ')[0]=='RED'" src="assets/svg/icon-unid-red.svg" />
                            <img class="select-none" *ngIf="unidOp.unidOperativa.split(' ')[0]=='CAM'" src="assets/svg/icon-select-CERP.svg" />
                            <img class="select-none" *ngIf="unidOp.unidOperativa.split(' ')[0]=='CIRAM'" src="assets/svg/icon-unid-ciram.svg" />
                            <div>
                                <div>{{unidOp.unidOperativa}}</div>
                                <div style="color: gray; font-weight: 300; font-size: 12px;">{{unidOp.rol | titlecase }}</div>
                            </div>
                        </div>
                        <button *ngIf="unidOp.vigente==1" class="bg-[#F4F5F7] px-2.5 h-[30px]"
                            (click)="AsignarUnidadOperativa(unidOp)">Seleccionar</button>
                        <p *ngIf="unidOp.vigente==0" class="py-1 font-bold mr-6">
                            Inactivo
                        </p>
                    </div>
                </ng-container>
                <ng-container *ngIf="listUnidOperativa.length == 0">
                    <div class="text-gray-600 w-full text-center">
                        <p class="py-1 font-bold">
                            No está asignado a una Unidad Operativa
                        </p>
                    </div>
                </ng-container>
            </ng-container>
        </div>
    </div>
</div>
