<div class="px-8 py-5 bg-white rounded-md text-[#344563] botonApariencia">
    <div class="flex flex-col gap-4 items-center max-w-[400px] text-center">
        <img class="w-20" src="assets/svg/alert-confirmation.svg">
        <span class="text-xl">{{data.titulo}}</span>
        <span *ngIf="data.subText" class="text-sm">{{data.subText}}</span>
        <div class="flex flex-row items-center gap-4">
            <div class="relative rounded-md shadow-sm botonApariencia">
                <app-btn [color]="'bordeado'" (click)="onClose()">Cancelar
                </app-btn>
            </div>
            <div class="relative rounded-md shadow-sm botonApariencia">
                <app-btn [color]="'mezclado'" (click)="onConfirm()">Confirmar
                </app-btn>
            </div>
        </div>
    </div>
</div>
