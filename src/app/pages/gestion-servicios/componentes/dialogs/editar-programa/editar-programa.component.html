<div class="botonApariencia">
    <div class="px-4 py-3 bg-cam flex justify-between text-white rounded-t-md">
      <span>Editar Programa</span>
      <button (click)="onClose()"><esp-icon icon="faClose"></esp-icon></button>
    </div>
  
    <form [formGroup]="programaForm" (ngSubmit)="updatePrograma()" class="bg-white flex flex-col text-[#37474F]">
      <div class="py-4">
        <div class="py-2.5">
          <div class="p-4">
            <label class="block text-sm font-medium text-gray-700">ID Programa</label>
            <input
            
              formControlName="idPrograma"
              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" 
            />
  
            <label class="block text-sm font-medium text-gray-700 mt-4">Nombre Programa</label>
            <input
              formControlName="nombrePrograma"
              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
              [ngClass]="{ 'border-red-500': programaForm.get('nombrePrograma')?.invalid && programaForm.get('nombrePrograma')?.touched }"
            />
            <div *ngIf="programaForm.get('nombrePrograma')?.invalid && programaForm.get('nombrePrograma')?.touched" class="text-red-500 text-sm">
              El nombre del programa es obligatorio y no debe exceder 50 caracteres.
            </div>
  
            <label class="block text-sm font-medium text-gray-700 mt-4">Fecha de Creación</label>
            <input
              formControlName="fechaCreacion"
              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"
              
            />
  
            <label class="block text-sm font-medium text-gray-700 mt-4">Fecha de Modificación</label>
            <input
              formControlName="fechaModificacion"
              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"
              
            />
  
            <label class="block text-sm font-medium text-gray-700 mt-4">Activo</label>
            <select
              formControlName="activo"
              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
            >
              <option [value]="1">Sí</option>
              <option [value]="0">No</option>
            </select>
          </div>
        </div>
      </div>
  
      <div class="flex justify-end gap-4 pt-6 pb-3 px-4 border-t border-[#F4F5F5]">
        <app-btn color="white" (click)="onClose()">Cancelar</app-btn>
        <app-btn type="submit" color="mezclado" [disabled]="isLoading">
          <span *ngIf="isLoading">Guardando...</span>
          <span *ngIf="!isLoading">Guardar Cambios</span>
        </app-btn>
      </div>
    </form>
  </div>
