<div class="botonApariencia">
    <div class="px-4 py-3 bg-cam flex justify-between text-white rounded-t-md">
      <span>Crear Servicio</span>
      <button (click)="onClose()"><esp-icon icon="faClose"></esp-icon></button>
    </div>
  
    <form [formGroup]="servicioForm" (ngSubmit)="crearServicio()" class="bg-white flex flex-col text-[#37474F] p-3">
      <div class="py-4">
        <div class="w-full flex flex-col gap-4">
            <div class="flex flex-col">
                <div class="relative">
                  <div class="relative">
                    <input
                      type="text"
                      name="nombreServicio"
                      formControlName="nombreServicio"
                      class="inputTextoDialog focusCampo !h-10 pr-7"
                      id="nombreServicio"
                      espEstiloInput
                      [ngClass]="{ 'border-red-500': servicioForm.get('nombreServicio')?.invalid && servicioForm.get('nombreServicio')?.touched }"
                    />
                    <label espEstiloLabel for="nombreServicio">Nombre Servicio</label>
                  </div>
      
                  <div *ngIf="servicioForm.get('nombreServicio')?.invalid && servicioForm.get('nombreServicio')?.touched">
                    <p class="font-medium text-red-500 text-xs mt-1 ml-1">
                      El nombre del servicio es obligatorio y no debe exceder 50 caracteres.
                    </p>
                  </div>
                </div>
              </div>

          <div class="flex flex-col">
            <div class="relative">
              <div class="relative">
                <select
                  name="subprograma"
                  formControlName="subprograma"
                  class="inputTextoDialog focusCampo !h-10 pr-7"
                  id="subprograma"
                  espEstiloInput
                >
                  <!-- Opciones dinámicas -->
                </select>
                <label espEstiloLabel for="subprograma">Subprograma</label>
              </div>
            </div>
          </div>
  
            <div class="flex flex-col">
            <div class="relative">
              <select
                name="tipoServicio"
                formControlName="tipoServicio"
                class="inputTextoDialog focusCampo !h-10 pr-7"
                id="tipoServicio"
                espEstiloInput
              >
               <option *ngFor="let opcion of opcionesEvento" [value]="opcion.idOpcion">
                {{opcion.nombre}}
               </option>
              </select>
              <label espEstiloLabel for="tipoServicio">Tipo de Servicio</label>
            </div>
          </div>
  
          
  
         <!-- <div class="flex flex-col">
            <div class="relative">
              <div class="relative">
                <select
                  name="activo"
                  formControlName="activo"
                  class="inputTextoDialog focusCampo !h-10 pr-7"
                  id="activo"
                  espEstiloInput
                >
                  <option [value]="1">Sí</option>
                  <option [value]="0">No</option>
                </select>
                <label espEstiloLabel for="activo">Activo</label>
              </div>
            </div>
          </div>-->
        </div>
      </div>
  
      <div class="flex justify-end gap-4 pt-6 pb-3 px-4 border-t border-[#F4F5F5]">
        <app-btn color="white" (click)="onClose()">Cancelar</app-btn>
        <app-btn type="submit" (click)="crearServicio()" color="mezclado" [disabled]="isLoading">
          <span *ngIf="isLoading">Guardando...</span>
          <span *ngIf="!isLoading">Crear Servicio</span>
        </app-btn>
      </div>
    </form>
  </div>
