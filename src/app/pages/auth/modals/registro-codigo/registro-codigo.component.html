
<div class="div-dialog-form" style="height: 374px !important">
    <!-- <div>
            <img src="assets/img/cam_login.png" alt="">
        </div> -->
   
    <mat-dialog-content class="div-dialog-form_content custom-dialog-container" style="height: 294px !important; margin-bottom: 0px;">
      <h1 class="text-s-18r" style="color: #FFFFFF; font-weight:900 !important; text-align: left !important; height: 34px !important; padding-top: 8px !important; padding-left: 16px !important; background-color: #008BD2;"> {{data.title}} </h1>
      <h2 class="text-s-20r pt-3 pb-3" style="color: #057EC9 !important; letter-spacing: 0.15px !important;">Se envió un código de activación a tu correo electrónico</h2>
      <p class="text-s-20r" style="color: #057EC9 !important; font-size: 26px !important; letter-spacing: 0.15px !important; font-weight: 700px !important;"> {{data.data.email}} </p>
      <div> </div> 

      <h2 class="text-s-20r pt-4" style="color: #000000 !important;letter-spacing: 0.15px !important; font-weight: 300 !important; margin-bottom: 25px !important;">Ingresa el código para activar tu cuenta<br></h2>

      <div> </div>

      <form [formGroup]="form" style="align-content: center !important; justify-content: center !important; margin-bottom: 1px;">
        <mat-form-field class="formRegistroCod" style="width: 190px !important; padding-top: 0px !important;">
          <mat-label class="text-s-16p" style="color: #64748B !important; opacity: 50%; text-align: center !important; padding-top: 0px !important; margin-top: 0px !important;">Código de Activación</mat-label>
          <input type="text" formControlName="codigoCtrl" matInput required style="text-align: center !important" />
          <!-- <mat-icon matSuffix>account_circle</mat-icon> -->
          <!-- <mat-error *ngIf="loginForm.controls.username.hasError('minlength')">
                Mínimo 8 dígitos
              </mat-error> -->
        </mat-form-field>
      </form>

      <div class="line-horizontal custom-dialog-container" style="margin-top: 25px;"></div>
    </mat-dialog-content>
    <mat-dialog-actions class="custom-dialog-container" style="height: 80px !important;">
      <div class="btn-dialog_RegCod text-s-18p" style="color: #3E4348 !important;">
        <button mat-raised-button mat-dialog-close>Cancelar</button>
        <button
          (click)="registrarUsuario()"
          mat-raised-button
          [disabled]="form.invalid || loading"
          class="btn-mat-primary"
          cdkFocusInitial
        >
          {{ loading ? "Validando..." : "CONFIRMAR" }}
        </button>
      </div>
      
    </mat-dialog-actions>
  </div>
