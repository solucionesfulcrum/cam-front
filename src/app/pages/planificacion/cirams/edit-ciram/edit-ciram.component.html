<div class="div-container">
  <div>
    <h1><b>Planificación</b></h1>
  </div>
  <mat-card>
    <mat-tab-group [(selectedIndex)]="demo1TabIndex">
      <mat-tab label="Profesionales" disabled> </mat-tab>

      <mat-tab label="CIRAMS">
        <div class="div-mat-tab">
          <div class="filtros-notif">
            <div class="filtros-notif-left"></div>
            <div class="filtros-notif-right">
              <button mat-raised-button class="matform-btn" (click)="salir()">
                Salir
              </button>
              <button mat-raised-button class="mat-btn-info matform-btn">
                <mat-icon>edit</mat-icon> Editar
              </button>
            </div>
          </div>
        </div>
        <div class="cards-contents">
          <mat-card>
            <mat-card-title> Información del CIRAM </mat-card-title>
            <mat-card-subtitle>
              Llene los campos obligatorios del CIRAM
            </mat-card-subtitle>

            <mat-card-content>
                <div class="div-content-form">
                  <mat-form-field>
                    <mat-label> Código ID </mat-label>
                    <input matInput />
                  </mat-form-field>
                </div>
                <div class="div-content-form">
                  <mat-form-field>
                    <mat-label> Nombres </mat-label>
                    <input matInput />
                  </mat-form-field>
                </div>
                <div class="div-content-form">
                  <mat-form-field>
                    <mat-label> Dirección </mat-label>
                    <input matInput />
                  </mat-form-field>
                </div>
                <div class="div-content-form">
                  <mat-form-field>
                    <mat-label> Distrito </mat-label>
                    <input matInput />
                  </mat-form-field>
                  <mat-form-field>
                    <mat-label> Nro. de Contacto </mat-label>
                    <input matInput />
                  </mat-form-field>
                </div>
                <div class="div-content-form">
                  <mat-form-field>
                    <mat-label> Responsable </mat-label>
                    <input matInput />
                  </mat-form-field>
                  <mat-form-field>
                    <mat-label> Correo Electrónico </mat-label>
                    <input matInput />
                  </mat-form-field>
                </div>
                <div class="div-content-form">
                  <mat-form-field>
                    <mat-label> CAM </mat-label>
                    <mat-select>
                      <mat-option value="cam1">CAM 1</mat-option>
                      <mat-option value="cam2">CAM 2</mat-option>
                      <mat-option value="cam3">CAM 3</mat-option>
                      <mat-option value="cam4">CAM 4</mat-option>
                    </mat-select>
                  </mat-form-field>
                  <mat-form-field>
                    <mat-label> Estado </mat-label>
                    <mat-select>
                      <mat-option value="Estado1">Estado 1</mat-option>
                      <mat-option value="Estado2">Estado 2</mat-option>
                      <mat-option value="Estado3">Estado 3</mat-option>
                      <mat-option value="Estado4">Estado 4</mat-option>
                    </mat-select>
                  </mat-form-field>
                </div>
              </mat-card-content>
          </mat-card>
          <mat-card>
            <mat-card-title> Imagen del CIRAM </mat-card-title>
            <mat-card-subtitle>
              Ingrese una imagen como referencia
            </mat-card-subtitle>
            <div>
              <input
                type="file"
                class="form-control"
                (change)="capturarFile($event)"
              />
            </div>
            <div *ngIf="imgPrevisualizada" class="div-img-pre">
              <img [src]="imgPrevisualizada" alt="" />
            </div>
          </mat-card>
        </div>
      </mat-tab>
      <mat-tab label="Talleristas" disabled> </mat-tab>
      <mat-tab label="Eventos" disabled> </mat-tab>
    </mat-tab-group>
  </mat-card>
</div>
