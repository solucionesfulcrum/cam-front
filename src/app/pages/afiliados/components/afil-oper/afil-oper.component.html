<div class="table-responsive">
    <table mat-table [dataSource]="dataSourceOp">
      <ng-container matColumnDef="fechaOperac"> 
        <!-- <th mat-header-cell *matHeaderCellDef >Fecha</th> -->
        <td mat-cell *matCellDef="let element" class="bg-white-100 text-s-14r w-1/6">
          {{ element.fechaOperac}}
        </td>
      

      <ng-container matColumnDef="horaOperac">
        <!-- <th mat-header-cell *matHeaderCellDef >Hora</th> -->
        <td mat-cell *matCellDef="let element" class="bg-white text-s-14r w-1/6">
          {{ element.horaOperac }}
        </td>
      </ng-container>

      <ng-container matColumnDef="descripOperac">
        <!-- <th mat-header-cell *matHeaderCellDef >Descripcion</th> -->
        <td mat-cell *matCellDef="let element" class="bg-white text-s-14r w-1/4">
          {{ element.descripOperac }}
        </td>
      </ng-container>
    </ng-container>      

    <!-- <tr
    mat-header-row
    *matHeaderRowDef="displayedColumns" [ngClass]="{'headerRow':false}"
    ></tr> -->
    <tr
    mat-row
    *matRowDef="let row; columns: displayedColumns; index as i" 
    ></tr> <!-- [ngClass]="getClassRow(i)" -->

  </table>

    <!-- <mat-paginator
      #paginator1
      [pageSizeOptions]="[25, 50, 100]"
      showFirstLastButtons
    ></mat-paginator> -->
  </div>
