<div class="px-4 py-3 bg-primary2 flex justify-between text-white text-s-18p">
    <span><b>Notas</b></span>
    <button (click)="onClose()"><esp-icon icon="faClose"></esp-icon></button>
</div>
<div class="px-4 py-3 bg-white h-400">

    <div class="flex justify-between space-x-1" [formGroup]="formNewFicha">

 
            <div class="w-5/6 relative mt-2 rounded-md shadow-sm">
              <input
                formControlName="frmDoc"
                placeholder="Agrega nueva nota - Max. 200 caracteres"
                type="text"
                name="doc"
                class="w-full text-sm rounded bg-white border-gray-400 border-1 px-4 py-2 font-light focusCampo"
                maxlength="200"
              />
            </div>            
            <div class="w-20 relative mt-2 rounded-md shadow-sm botonApariencia text-s-16p  ">
                    <app-btn typeBtn="submit" color="primary" (click)="onAgregar()">Agregar
                    </app-btn>
            </div>
  
                
    </div>

    <div class="my-4 text-s-16p">
      <b>El [19/09/2023] [Jose Mauricio] Escribió: </b><br>
      <p class="my-4"> {{ textoIngresado }}</p>
      
      
    </div>
