<div class="mx-6">
    <esp-opciones-busqueda 
      [showDateFilter]="true"
      [setFilterDateOptionSelected]="'var(--color-CAM-mezclado)'" 
      [setFilterDateTextColour]="'#057EC9'"
      [filterDateAppearance]="2"
      (sendDateFilterWithCeros)="getDataFecha($event)"
      [setFilterDateSelectionBg]="'#008BD2'"
      [setFilterDateButtonBg]="'#008BD2'"
      [showSearch]="true"
      [searchInputPlaceHolder]="'Busqueda de texto'"
      
    ></esp-opciones-busqueda> <!-- (buttonAccion)="goToNewRol()"   -->
</div>
    
<div class="mx-6">
    <table cdk-table class="w-full text-sm text-left text-gray-500 tablaDatos" [dataSource]="dataPrueba" >
      <tr cdk-header-row class="text-xs text-gray-700 bg-gray-50" *cdkHeaderRowDef="columns"></tr>
      <tr cdk-row class="bg-white border-b" *cdkRowDef="let row; columns: columns"></tr>
      <ng-container cdkColumnDef="marcar">
        <th cdk-header-cell class="py-[1.25rem] px-6" *cdkHeaderCellDef> <input type="checkbox" value="false"/> </th>
        <td cdk-cell class="py-[1rem] px-6" *cdkCellDef="let row"> <input type="checkbox" value="false"/> </td>
      </ng-container>

      <ng-container cdkColumnDef="nombres">
        <th cdk-header-cell class="py-[1.25rem] px-6" *cdkHeaderCellDef>Nombres</th>
        <td cdk-cell class="py-[1rem] px-6 text-[#057EC9]" *cdkCellDef="let row"><span class="text-Name">{{ row.nombre }}</span></td>
      </ng-container>

      <ng-container cdkColumnDef="tipoDoc">
        <th cdk-header-cell class="py-[1.25rem] px-6" *cdkHeaderCellDef>TIPO</th>
        <td cdk-cell class="py-[1rem] px-6 font-semibold" *cdkCellDef="let row">{{ row.tipoDoc }}</td>
      </ng-container>

      <ng-container cdkColumnDef="numDoc">
        <th cdk-header-cell class="py-[1.25rem] px-6" *cdkHeaderCellDef>N° de Documento</th>
        <td cdk-cell class="py-[1rem] px-6" *cdkCellDef="let row">{{row.numDoc }}</td>
      </ng-container>

      <ng-container cdkColumnDef="edad">
        <th cdk-header-cell class="py-[1.25rem] px-6" *cdkHeaderCellDef>Edad</th>
        <td cdk-cell class="py-[1rem] px-6" *cdkCellDef="let row">{{row.edad }} Años</td>
      </ng-container>

      <ng-container cdkColumnDef="estadoCivil">
        <th cdk-header-cell class="py-[1.25rem] px-6" *cdkHeaderCellDef>E. CIVIL</th>
        <td cdk-cell class="py-[1rem] px-6" *cdkCellDef="let row">{{row.estadoCivil }}</td>
      </ng-container>

      <ng-container cdkColumnDef="ipress">
        <th cdk-header-cell class="py-[1.25rem] px-6" *cdkHeaderCellDef>IPRESS</th>
        <td cdk-cell class="py-[1rem] px-6" *cdkCellDef="let row">{{row.ipress }}</td>
      </ng-container>

      <ng-container cdkColumnDef="fecha">
        <th cdk-header-cell class="py-[1.25rem] px-6" *cdkHeaderCellDef>Fecha</th>
        <td cdk-cell class="py-[1rem] px-6" *cdkCellDef="let row">{{row.fecha }}</td>
      </ng-container>
    </table>
    <mat-paginator #paginator class="demo-paginator paginatorDatos" 
    (page)="handlePageEvent($event)"
    [length]="total"
    [pageSize]="pageSize"
    showFirstLastButtons="true"
    [pageSizeOptions]="pageSizeOptions.length > 0 ? pageSizeOptions : []"
    [pageIndex]="pageIndex"
    aria-label="Select page">
    </mat-paginator>
