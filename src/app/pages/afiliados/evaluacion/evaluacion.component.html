<div class="container block centrar mx-60 my-40  " >
<div class="content flex px-4 py-3 bg-primary2 flex text-white w-800px ">
    <span class="text-s-18r w-800px flex centrar" ><b>Evaluar Afiliado</b></span>
    <!--<button (click)="onClose()"><esp-icon icon="faClose"></esp-icon></button>-->
</div>
<div class="content px-4 py-4 bg-white w-800px rounded-md border-b-2 shadow-sm ">
    <b class="pb-3 pt-3 d-flex text-s-16r">Unidad Operativa - CAM LIMA</b>
    <div class="content flex justify-between space-x-8">
        <div class="container w-1/2 h-40px mt-2 p-0 mt-0 " >
            <div class="relative rounded-md shadow-sm " >
              <select
                id="searchDoc"
                formControlName="frmSelectDoc"
                placeholder="Seleccione su tipo de Documento"
                class="flex w-full space-x-5 bg-slate-50 border border-gray-300 text-gray-900 text-sm rounded-lg focusCampo block  dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                style="height: 38px !important"
              >
                <option class="text-s-16p" value="" disabled selected>Seleccione su tipo de documento</option>
                <option *ngFor="let documento of opciones" [value]='documento.valor1'>{{documento.nombre | titlecase}}</option> 
                <!--<option value="1">Registrado</option> -->
              </select>
            </div>
        </div>  
        <div class="w-1/2">
            <div class="relative mt-2 rounded-md shadow-sm">
              <input
                formControlName="frmDoc"
                placeholder="N° de Documento"
                type="text"
                name="doc"
                class="h-90px w-full text-sm rounded bg-white border-gray-300 border-1 px-4 py-2 font-light focusCampo text-s-16p"
                                            
              />
            </div>
            <div *ngIf="formNewFicha.controls.frmDoc.touched && formNewFicha.controls.frmDoc.invalid">
              <p *ngIf="formNewFicha.controls.frmDoc.hasError('required')" class="font-medium text-red-500 text-xs mt-1 ml-1">
                El documento es obligatorio
              </p>
            </div> 
        
        </div>  
    </div>
    <div class="flex justify-center space-x-2 text-menucolor">
      <div class="w-1/6 mt-10 ">
          <div class="relative mt-2 rounded-md shadow-sm botonApariencia ">
              <app-btn typeBtn="submit" color="white" (click)="onClose()" >Cancelar
              </app-btn> 
          </div>
      </div> 
      <div class="w-1/4 mt-10">
          <div class="relative mt-2 rounded-md shadow-sm botonApariencia ">
            <app-btn typeBtn="submit" (click)="onSearch()" style="background-color: 057EC9">Buscar Asegurado
              </app-btn> 
          </div>
      </div>
    </div>

    <div *ngIf="hayError" class="flex justify-center space-x-2">
      <span class="text-red-500">{{msgError}}</span>
    </div>
    <div *ngIf="seEncontro" class="flex justify-center">
      <div class="boxMsgSatisf">
        <div class="boxSpanMsg">
          <span>{{msgEncontro | titlecase}}</span>
        </div>
        <div class="btnSgte">
          <app-btn typeBtn="submit" color="success" class="botonMezclado" (click)="setLink2(createRequest().numDoc, createRequest().tipoDoc)">Generar Ficha de Admisión
          </app-btn> 
        </div>
      </div>
    </div>

</div>
</div>
