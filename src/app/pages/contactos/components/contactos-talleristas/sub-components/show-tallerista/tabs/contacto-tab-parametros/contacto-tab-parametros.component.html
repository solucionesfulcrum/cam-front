<div class="flex flex-col gap-2 py-[18px]">
    <div class="flex flex-col gap-2.5">
        <p class="subtituloMarcado"> Activación Vigente</p>
        <div>
            <div class="grid grid-cols-6 gap-1 border-b-2 border-gray-300 pb-2 text-[14px] filasPseudoTabla">
              <span>Usuario que activa</span>
              <span>Fecha Inicio</span>
              <span>Fecha Fin</span>
              <span>Unid Ope</span>
              <span>Rol</span>
              <span>Estado</span>
            </div>
            
            <div>
              <div class="dataPseudoTabla">
                <span class="text-[#008BD2]">ROXANA ESTRADA ARIAS</span>
                <span>20/02/2023</span>
                <span>20/08/2023</span>
                <span>CERPS LIMA</span>
                <span>Adm CERPS</span>
                <span class="flex flex-row flex-wrap gap-2" [ngClass]="true ? 'text-green-500':'text-red-500'">Activo</span>
              </div>
            </div>
            <!-- <div *ngIf="dataActivacion">
              <div class="dataPseudoTabla">
                <span class="text-[#008BD2]">{{dataActivacion.usuarioQueActivo}}</span>
                <span>{{dataActivacion.fechaInicio | date:'dd/MM/yyyy'}}</span>
                <span>{{dataActivacion.fechaFin | date:'dd/MM/yyyy'}}</span>
                <span>{{dataActivacion.unidadOperativa}}</span>
                <span>{{dataActivacion.rol}}</span>
                <span class="flex flex-row flex-wrap gap-2" [ngClass]="dataActivacion.estado === 'Activo' ? 'text-green-500':'text-red-500'">{{dataActivacion.estado}}</span>
              </div>
            </div> -->
        </div>
    </div>
    <div class="flex flex-col">
        <p class="subtituloMarcado"> Talleres</p>
        <div class="pl-2.5 py-2.5">
            <ul class="Lista-Opciones-Marcar">
                <li *ngFor="let proceso of opcionesProcesos, index as i">
                    <input type="checkbox" [id]="'proceso_'+proceso.procesoId" [value]="proceso.procesoId" class="peer focusCampo">
                    <label [for]="'proceso_'+proceso.procesoId" class="hover:text-gray-600 hover:bg-gray-50">                           
                        <span class="text-base">{{proceso.nombre}}</span>
                    </label>
                </li>
            </ul>
        </div>
    </div>
</div>
