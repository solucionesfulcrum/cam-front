<div class="botonApariencia">
    <div class="px-4 py-3 bg-cam flex justify-between text-white rounded-t-md">
      <span>Asignar asegurado a CIRAM</span>
      <button (click)="onClose()"><esp-icon icon="faClose"></esp-icon></button>
    </div>
  
    <div class="bg-white flex flex-col text-[#37474F]">
      <div class="py-4">
        <div class="py-2.5">
          <div class="flex flex-col items-center gap-2.5 p-2.5 text-center leading-5">
            <!-- Dropdown personalizado -->
            <div class="relative mt-2 rounded-md shadow-sm w-full" [formGroup]="form">
                <select formControlName="idUnidadOperativa" 
                    id="rol"
                  class="space-x-5 bg-slate-50 border border-gray-300 text-gray-900 text-sm rounded-lg focusCampo block w-full"
                  espEstiloInput>
                  <option *ngFor="let opcion of listCiram" [value]="opcion.idUnidadOperativa">
                    {{opcion.nombre}}
                  </option>
                </select>
                <label for="rol" espEstiloLabel>CIRAM</label>
                <div *ngIf="form.controls.idUnidadOperativa.touched && form.controls.idUnidadOperativa.invalid">
                    <p *ngIf="form.controls.idUnidadOperativa.hasError('required')" class="font-medium text-red-500 text-xs mt-1 ml-1">
                        Seleccione un CIRAM
                    </p>
                </div>
              </div>
          </div>
        </div>
      </div>
      <div class="flex flex-row justify-center pt-6 pb-3 px-4 border-t border-[#F4F5F5]">
        <div class="w-fit">
          <app-btn class="botonApariencia flex" type="submit" color="mezclado" (click)="okBtn()">Asignar</app-btn>
        </div>
      </div>
    </div>
  </div>
