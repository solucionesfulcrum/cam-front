        <div class="div-mat-tab">
          <div class="filtros-notif" [formGroup]="form">
            <div class="filtros-notif-left">
              <mat-form-field class="mat-full-width">
                <mat-icon matPrefix>search</mat-icon>
                <input
                  (keyup)="filtrarTabla($event)"
                  matInput
                  placeholder="Búscar"
                />
              </mat-form-field>
              <mat-form-field>
                <mat-label>Estado</mat-label>
                <mat-select>
                  <mat-option value="1">DISPONIBLES</mat-option>
                  <mat-option value="2">SUSPENDIDO</mat-option>
                  <mat-option value="3">NO DISPONIBLE</mat-option>
                </mat-select>
              </mat-form-field>
            </div>
            <div class="filtros-notif-right ">
              
              <button
                mat-raised-button
                class="mat-btn-primary text-uppercase"
              >
                NUEVO UBIGEO 
              </button>
            </div>
          </div>
          <div class="table-responsive">
            <table mat-table [dataSource]="dataSource">
              <ng-container matColumnDef="descDep">
                <th mat-header-cell *matHeaderCellDef>DEPARTAMENTO</th>
                <td mat-cell *matCellDef="let element">
                  <a
                    mat-flat-button
                    class="btn-flat-info"
                    (click)="setLink2(element.idUbigeo, element.codigo)"
                    routerLink="/cirams/show/{{element.codigo}}"
                  >
                    {{ element.descDep}} 
                  </a>
                </td>
              </ng-container>

             <ng-container matColumnDef="descProv">
                <th mat-header-cell *matHeaderCellDef>PROVINCIA</th>
                <td mat-cell *matCellDef="let element">
                    {{ element.descProv }} 
                </td>
              </ng-container>

              <ng-container matColumnDef="descDis">
                <th mat-header-cell *matHeaderCellDef>DISTRITO</th>
                <td mat-cell *matCellDef="let element">
                  {{ element.descDis}}
                </td>
              </ng-container>

              <tr
                mat-header-row
                *matHeaderRowDef="displayedColumns"
              ></tr>
              <tr
                mat-row
                *matRowDef="let row; columns: displayedColumns"
              ></tr>
            </table>
            <mat-paginator
              #paginator
              [pageSizeOptions]="[25, 50, 100]"
              showFirstLastButtons
            ></mat-paginator>
          </div>
        </div>
