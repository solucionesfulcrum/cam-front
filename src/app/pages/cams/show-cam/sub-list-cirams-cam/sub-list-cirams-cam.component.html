    <div *ngIf="this.cirams.length > 0 else nodata ">
    <div class="mt-3" [formGroup]="form">
        <div class="d-flex">
          <div class="w-50">
            <mat-form-field class="w-100">
              <mat-icon matPrefix>search</mat-icon>
              <input matInput placeholder="Búscar" />
            </mat-form-field>
          </div>
        </div>
      </div>

      <div class="table-responsive">
        <table mat-table [dataSource]="dataSource">
          <ng-container matColumnDef="circuloAdultoMayor">
            <th mat-header-cell *matHeaderCellDef>CIRCULO ADULTO MAYOR</th>
            <td mat-cell *matCellDef="let element">
              <a mat-flat-button class="text-primary2" routerLink="/cams/cirams/show/{{element.idciram}}">
                {{ element.descripcion }}
              </a>
            </td>
          </ng-container>

          <ng-container matColumnDef="adminCiram">
            <th mat-header-cell *matHeaderCellDef>ADMINISTRADOR - CIRAM </th>
            <td mat-cell *matCellDef="let element">
              <span *ngIf="element.adminCiram "> {{ element.adminCiram }} </span>
              <span *ngIf="element.adminCiram! "> --- </span>
              
            </td>
          </ng-container>

          <ng-container matColumnDef="codigo">
            <th mat-header-cell *matHeaderCellDef>CODIGO</th>
            <td mat-cell *matCellDef="let element">
              {{ element.codigo }}
            </td>
          </ng-container>

          <ng-container matColumnDef="fechaCreacion">
            <th mat-header-cell *matHeaderCellDef>FECHA DE CREACION</th>
            <td mat-cell *matCellDef="let element">
              <span *ngIf="element.fechaCreacion"> {{element.codigo }} </span>
              <span *ngIf="element.fechaCreacion!"> --- </span>
            </td>
          </ng-container>

          <ng-container matColumnDef="estado">
            <th mat-header-cell *matHeaderCellDef>ESTADO</th>
            <td mat-cell *matCellDef="let element">
              {{ element.estado }}
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
        <mat-paginator
          #paginator1
          [pageSizeOptions]="[25, 50, 100]"
          showFirstLastButtons
        ></mat-paginator>
      </div>

      </div>

    <ng-template #nodata>
      <div class="vertical-center center ">
        <div class="block space-y-5 mt-20">
          <div>
          <span >
            <img class="ml-20" src="assets/noRegistrosHijos.svg" />
          </span>
          </div>
          <div>
          <span class="text-gray-500 text-s-14">NO EXISTEN REGISTROS DISPONIBLES</span>
          </div>
        </div>
      </div>
     </ng-template>
