        <div class="div-mat-tab">
          <div class="filtros-notif" [formGroup]="form">
            <div class="filtros-notif-left">
              <mat-form-field class="mat-full-width">
                <mat-icon matPrefix>search</mat-icon>
                <input
                  (keyup)="filtrarTabla($event)"
                  matInput
                  placeholder="Búscar"
                />
              </mat-form-field>
              <mat-form-field>
                <mat-label>Estado</mat-label>
                <mat-select>
                  <mat-option value="1">DISPONIBLES</mat-option>
                  <mat-option value="2">SUSPENDIDO</mat-option>
                  <mat-option value="3">NO DISPONIBLE</mat-option>
                </mat-select>
              </mat-form-field>
            </div>
            <div class="filtros-notif-right ">
              
              <button
                mat-raised-button
                class="mat-btn-primary text-uppercase"
              >
                Nuevo CIRAM 
              </button>
            </div>
          </div>
          <div class="table-responsive">
            <table mat-table [dataSource]="dataSource">
              <ng-container matColumnDef="nombre">
                <th mat-header-cell *matHeaderCellDef>RED</th>
                <td mat-cell *matCellDef="let element">
                  <a
                    mat-flat-button
                    class="btn-flat-info"
                    (click)="setLink2(element.nombre, element.idred)"
                    routerLink="/redes/show/{{element.idred}}"
                  >
                    {{ element.nombre}}
                  </a>
                </td>
              </ng-container>

             <ng-container matColumnDef="redasiscod">
                <th mat-header-cell *matHeaderCellDef>RED ASISTENCIAL</th>
                <td mat-cell *matCellDef="let element">
                  {{ element.redasiscod }}
                </td>
              </ng-container>

              <ng-container matColumnDef="tipo">
                <th mat-header-cell *matHeaderCellDef>TIPO</th>
                <td mat-cell *matCellDef="let element">
                  {{ element.tipo}}
                </td>
              </ng-container>

              <ng-container matColumnDef="region">
                <th mat-header-cell *matHeaderCellDef>REGION</th>
                <td mat-cell *matCellDef="let element">
                  {{ element.region }}
                </td>
              </ng-container>

              <ng-container matColumnDef="estado">
                <th mat-header-cell *matHeaderCellDef>ESTADO</th>
                <td mat-cell *matCellDef="let element">
                  {{ element.estado }}
                </td>
              </ng-container>

              <tr
                mat-header-row
                *matHeaderRowDef="displayedColumns"
              ></tr>
              <tr
                mat-row
                *matRowDef="let row; columns: displayedColumns"
              ></tr>
            </table>
            <mat-paginator
              #paginator
              [pageSizeOptions]="[25, 50, 100]"
              showFirstLastButtons
            ></mat-paginator>
          </div>
        </div>
