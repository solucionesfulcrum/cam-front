    <div *ngIf="this.cams.length > 0 else nodata ">
<div class="mt-3" [formGroup]="form">
  <div class="d-flex">
    <div class="w-50">
      <mat-form-field class="w-100">
        <mat-icon matPrefix>search</mat-icon>
        <input matInput placeholder="Búscar" />
      </mat-form-field>
    </div>
  </div>
</div>

<div class="d-block w-100">
  <table mat-table [dataSource]="dataSource" class="w-100">
    <ng-container matColumnDef="index">
      <th mat-header-cell *matHeaderCellDef>№</th>
      <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
    </ng-container>
    <ng-container matColumnDef="cam">
      <th mat-header-cell *matHeaderCellDef>CAMS</th>
      <td mat-cell *matCellDef="let element">
        <a class="text-sky-700" routerLink="/cams/show/{{element.idCam}}">
          <span class="text-sky-700">
          {{ element.descripcion }}
          </span>
        </a>
      </td>
    </ng-container>

    <ng-container matColumnDef="adminCam">
      <th mat-header-cell *matHeaderCellDef>ADMINISTRADOR - CAM</th>
      <td mat-cell *matCellDef="let element">Sin asignar</td>
    </ng-container>

    <ng-container matColumnDef="fechaCreacion">
      <th mat-header-cell *matHeaderCellDef>FECHA DE CREACION</th>
      <td mat-cell *matCellDef="let element">---</td>
    </ng-container>

    <ng-container matColumnDef="codigo">
      <th mat-header-cell *matHeaderCellDef>CODIGO</th>
      <td mat-cell *matCellDef="let element">
        {{ element.codigo }}
      </td>
    </ng-container>

    <ng-container matColumnDef="red">
      <th mat-header-cell *matHeaderCellDef>RED</th>
      <td mat-cell *matCellDef="let element">
        <span *ngIf="element.red"> {{ element.red.nombre }} </span> 
        <span *ngIf="element.red!"> --- </span> 
      </td>
    </ng-container>

    <ng-container matColumnDef="estado">
      <th mat-header-cell *matHeaderCellDef>ESTADO</th>
      <td mat-cell *matCellDef="let element">
        <span *ngIf="element.estado === 1">
          <img class="img-logo" src="assets/casaVerde.svg" />
        </span>
        <span *ngIf="element.estado === 2">
          <img class="img-logo" src="assets/casaRoja.svg" />
        </span>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <mat-paginator
    #paginator1
    [pageSizeOptions]="[25, 50, 100]"
    showFirstLastButtons
  ></mat-paginator>
</div>
</div>

    <ng-template #nodata>
      <div class="vertical-center center ">
        <div class="block space-y-5">
          <div>
          <span >
            <img class="ml-20" src="assets/noRegistrosHijos.svg" />
          </span>
          </div>
          <div>
          <span class="text-gray-500 text-s-14">NO EXISTEN REGISTROS DISPONIBLES</span>
          </div>
        </div>
      </div>
     </ng-template>
