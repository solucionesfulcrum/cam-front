<esp-opciones-busqueda 
  [showDateFilter]="true"
  [setFilterDateTextColour]="'#057EC9'"
  [setFilterDateOptionSelected]="'linear-gradient(90.57deg, #057EC9 13.31%, #28C2FF 99.53%)'"
  [setFilterDateSelectionBg]="'#008BD2'"
  [setFilterDateButtonBg]="'#008BD2'"
  [showSearch]="true"
  [searchInputPlaceHolder]="'Busqueda de Roles'"
  [showFirstDisplayFilter]="true"
  [firstDisplayFilterPlaceholder]="{'indicador': true, 'placeholder': 'Todos los estados'}"
  [firstDisplayFilterData]="opciones"
  [showButton]="true"
  [buttonText]="'Nuevo ROL'"
  [buttonBg]="'#057EC9'"
  (buttonAccion)="goToNewRol()"
></esp-opciones-busqueda>
<div class="">

  <table mat-table [dataSource]="dataSource2">

    <ng-container matColumnDef="counter">
      <th mat-header-cell *matHeaderCellDef class="" style="width: 64px !important;">Nro</th>
      <td mat-cell *matCellDef="let element" class="justify-left " style="align-content: start;">
        {{ element.counter }}
      </td>
    </ng-container>
    
    <!--<ng-container matColumnDef="idRolAplicacion">
      <th mat-header-cell *matHeaderCellDef class="">ID</th>
      <td mat-cell *matCellDef="let element" class="justify-left " style="align-content: start;">
        <a
          class="decorator-none text-primary3"
          (click)="setLink2(element.nombre, element.idRolAplicacion )"
          routerLink="/usuarios/roles/show/{{ element.idRolAplicacion }}"
        >
          {{ element.codigo }}
        </a>
      </td>
    </ng-container>


      <ng-container matColumnDef="codigo">
      <th mat-header-cell *matHeaderCellDef class="">CODIGO </th>
      <td mat-cell *matCellDef="let element">
        {{ element.codigo }}
      </td>
    </ng-container> -->

    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef style="width: 297px !important;">NOMBRE DE ROL</th>
      <td mat-cell *matCellDef="let element">
        {{ element.nombre }}
      </td>
    </ng-container>

    <ng-container matColumnDef="descripcion">
      <th mat-header-cell *matHeaderCellDef style="width: 388px !important;">DESCRIPCION</th>
      <td mat-cell *matCellDef="let element">
        {{ element.descripcion }}
      </td>
    </ng-container>

    <ng-container matColumnDef="permisos">
      <th mat-header-cell *matHeaderCellDef style="width: 140px !important;">PERMISOS</th>
      <td mat-cell *matCellDef="let element">
        {{ element.permisos }}
      </td>
    </ng-container>

    <ng-container matColumnDef="fechReg">
      <th mat-header-cell *matHeaderCellDef style="width: 140px !important;">FECHA DE REGISTRO</th>
      <td mat-cell *matCellDef="let element">
        {{ element.fechReg }}
      </td>
    </ng-container>

    <ng-container matColumnDef="estado">
      <th mat-header-cell *matHeaderCellDef style="width: 130px !important; text-align: center !important;">ESTADO</th>
      <td mat-cell *matCellDef="let element">
        {{ element.estado }}
      </td>
    </ng-container>
    

    <tr
      mat-header-row [ngClass]="{'headerRow':true}" *matHeaderRowDef="displayedColumns" >
    </tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns;  index as i"  
    ></tr>  <!-- [ngClass]="getClassRow(i)" -->
  </table>
  <mat-paginator
    #paginator
    [pageSizeOptions]="[25, 50, 100]"
    showFirstLastButtons
  ></mat-paginator>
</div>
