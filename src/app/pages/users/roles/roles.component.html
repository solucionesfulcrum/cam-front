        <div class="div-mat-tab">
          <div class="filtros-notif" [formGroup]="form">
            <div class="filtros-notif-left">
              <mat-form-field class="mat-full-width">
                <mat-icon matPrefix>search</mat-icon>
                <input
                  (keyup)="filtrarTabla($event)"
                  matInput
                  placeholder="Búscar"
                />
              </mat-form-field>
              <mat-form-field>
                <mat-label>Estado</mat-label>
                <mat-select>
                  <mat-option value="1">DISPONIBLES</mat-option>
                  <mat-option value="2">SUSPENDIDO</mat-option>
                  <mat-option value="3">NO DISPONIBLE</mat-option>
                </mat-select>
              </mat-form-field>
            </div>
            <div class="filtros-notif-right ">
              
              <button
                mat-raised-button
                class="mat-btn-primary text-uppercase"
                routerLink="/usuarios/roles/new"
              >
                Nuevo rol de usuario 
              </button>
            </div>
          </div>
          <div class="">

            <table mat-table [dataSource]="dataSource2">
            <ng-container matColumnDef="idRolAplicacion">
                <th mat-header-cell *matHeaderCellDef class="">ID</th>
                <td mat-cell *matCellDef="let element" class="justify-left " style="align-content: start;">
                  <a
                    class="decorator-none text-primary3"
                    (click)="setLink2(element.nombre, element.idRolAplicacion )"
                    routerLink="/usuarios/roles/show/{{ element.idRolAplicacion }}"
                  >
                    {{ element.codigo }}
                  </a>
                </td>
              </ng-container>


              <ng-container matColumnDef="codigo">
                <th mat-header-cell *matHeaderCellDef class="">CODIGO </th>
                <td mat-cell *matCellDef="let element">
                  {{ element.codigo }}
                </td>
              </ng-container>

             <ng-container matColumnDef="nombre">
                <th mat-header-cell *matHeaderCellDef>NOMBRE DE ROL DE USUARIO</th>
                <td mat-cell *matCellDef="let element">
                  {{ element.nombre }}
                </td>
              </ng-container>

              <tr
                mat-header-row
                *matHeaderRowDef="displayedColumns"
              ></tr>
              <tr
                mat-row
                *matRowDef="let row; columns: displayedColumns"
              ></tr>
            </table>
            <mat-paginator
              #paginator
              [pageSizeOptions]="[25, 50, 100]"
              showFirstLastButtons
            ></mat-paginator>
          </div>
        </div>
