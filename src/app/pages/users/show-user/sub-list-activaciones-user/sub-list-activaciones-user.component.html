    <div class="mt-3" [formGroup]="form">
        <div class="d-flex">
          <div class="w-50">
            <mat-form-field class="w-100">
              <mat-icon matPrefix>search</mat-icon>
              <input matInput placeholder="Búscar" />
            </mat-form-field>
          </div>
        </div>
      </div>

      <div class="table-responsive">
        <table mat-table [dataSource]="dataSource">

          <ng-container matColumnDef="i">
            <th mat-header-cell *matHeaderCellDef>CAMS</th>
            <td mat-cell *matCellDef="let element">
                {{ element.i}}
            </td>
          </ng-container>

          <ng-container matColumnDef="usuarioResponsable">
            <th mat-header-cell *matHeaderCellDef>USUARIO RESPONSABLE</th>
            <td mat-cell *matCellDef="let element">
              {{ element.usuarioResponsable}}
            </td>
          </ng-container>

          <ng-container matColumnDef="fechaInicio">
            <th mat-header-cell *matHeaderCellDef>Fecha de inicio</th>
            <td mat-cell *matCellDef="let element">
              {{ element.fechaInicio }}
            </td>
          </ng-container>

          <ng-container matColumnDef="fechaFin">
            <th mat-header-cell *matHeaderCellDef>Fecha fin</th>
            <td mat-cell *matCellDef="let element">
              {{ element.fechaFin }}
            </td>
          </ng-container>

          <ng-container matColumnDef="perfil">
            <th mat-header-cell *matHeaderCellDef>Perfil</th>
            <td mat-cell *matCellDef="let element">
              {{ element.perfil }}
            </td>
          </ng-container>

          <tr
                mat-header-row
                *matHeaderRowDef="displayedColumns" [ngClass]="{'headerRow':true}"
              ></tr>
              <tr
                mat-row
                *matRowDef="let row; columns: displayedColumns; index as i" [ngClass]="getClassRow(i)"
              ></tr>

        </table>
        <mat-paginator
          #paginator1
          [pageSizeOptions]="[25, 50, 100]"
          showFirstLastButtons
        ></mat-paginator>
      </div>
