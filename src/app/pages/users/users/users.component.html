        <div class="div-mat-tab">
          <div class="filtros-notif" [formGroup]="form">
            <div class="filtros-notif-left">
              <mat-form-field class="mat-full-width">
                <mat-icon matPrefix>search</mat-icon>
                <input
                  (keyup)="filtrarTabla($event)"
                  matInput
                  placeholder="Búscar"
                />
              </mat-form-field>
              <mat-form-field>
                <mat-label>Estado</mat-label>
                <mat-select>
                  <mat-option value="1">TODOS</mat-option>
                  <mat-option value="1">DISPONIBLES</mat-option>
                  <mat-option value="2">SUSPENDIDO</mat-option>
                  <mat-option value="3">NO DISPONIBLE</mat-option>
                </mat-select>
              </mat-form-field>
            </div>
            <div class="filtros-notif-right ">

              <button
                mat-raised-button
                class="mat-btn-primary text-uppercase"
                routerLink="/usuarios/new"
              >
                Nuevo usuario 
              </button>
            </div>
          </div>
          <div class="">
            <table mat-table [dataSource]="dataSource">
              <ng-container matColumnDef="usuario" class="">
                <th mat-header-cell *matHeaderCellDef class="">Usuario</th>
                <td mat-cell *matCellDef="let element" class="justify-left " style="align-content: start;">
                  <a
                    class="decorator-none text-primary3"
                    (click)="setLink2(element.nombres, element.guiid)"
                    routerLink="/usuarios/show/{{element.guiid}}"
                  >
                    {{ element.usuario}}
                  </a>
                </td>
              </ng-container>

              <ng-container matColumnDef="nombres">
                <th mat-header-cell *matHeaderCellDef>Nombres</th>
                <td mat-cell *matCellDef="let element">
                  {{ element.nombres}}
                </td>
              </ng-container>

              <ng-container matColumnDef="rol">
                <th mat-header-cell *matHeaderCellDef>ROLES</th>
                <td mat-cell *matCellDef="let element">
                  {{ element.rol}}
                </td>
              </ng-container>

              <ng-container matColumnDef="tieneVigencia">
                <th mat-header-cell *matHeaderCellDef>Activo</th>
                <td mat-cell *matCellDef="let element">

                  <span *ngIf="element.tieneVigencia" class="bg-green-100 text-green-800 text-xs font-medium mr-2 px-2.5 py-0.5 rounded dark:bg-gray-700 dark:text-green-400 border border-green-400">Green</span>
                  <span *ngIf="!element.tieneVigencia" class="bg-green-100 text-green-800 text-xs font-medium mr-2 px-2.5 py-0.5 rounded dark:bg-gray-700 dark:text-green-400 border border-green-400">Green</span>
                </td>
              </ng-container>

              <ng-container matColumnDef="detalle">
                <th mat-header-cell *matHeaderCellDef>Detalle</th>
                <td mat-cell *matCellDef="let element">
                  Ve detalle 
                </td>
              </ng-container>

              <tr
                mat-header-row
                *matHeaderRowDef="displayedColumns"
              ></tr>
              <tr
                mat-row
                *matRowDef="let row; columns: displayedColumns"
              ></tr>
            </table>
            <mat-paginator
              #paginator
              [pageSizeOptions]="[25, 50, 100]"
              showFirstLastButtons
            ></mat-paginator>
          </div>
        </div>
