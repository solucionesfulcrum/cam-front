<div class="div-mat-tab">
  <div class="filtros-notif" [formGroup]="form">
    <div class="filtros-notif-left">
      <mat-form-field class="mat-full-width">
        <mat-icon matPrefix>search</mat-icon>
        <input 
        (keyup)="applyFilter($event)"
        matInput placeholder="Búscar" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Estado</mat-label>
        <mat-select>
          <mat-option value="1">TODOS</mat-option>
          <mat-option value="1">DISPONIBLES</mat-option>
          <mat-option value="2">SUSPENDIDO</mat-option>
          <mat-option value="3">NO DISPONIBLE</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    <div class="filtros-notif-right">
      
    </div>
  </div>
  <div class="">
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="nombres" class="">
        <th mat-header-cell *matHeaderCellDef class="">DNI</th>
        <td
          mat-cell
          *matCellDef="let element"
          class="justify-left"
          style="align-content: start"
        >
          <a
            class="decorator-none text-primary3 text-w-semibold"
            (click)="setLink2(element.nombres, element.guiid)"
            routerLink="/usuarios/show/{{ element.guiid }}"
          >
            {{ element.usuario }}
          </a>
        </td>
      </ng-container>

      <ng-container matColumnDef="usuario">
        <th mat-header-cell *matHeaderCellDef>Nombres</th>
        <td mat-cell *matCellDef="let element">
          {{ element.nombres }}
        </td>
      </ng-container>

      <ng-container matColumnDef="cam">
        <th mat-header-cell *matHeaderCellDef>CAM</th>
        <td mat-cell *matCellDef="let element">CAM ALMENARA</td>
      </ng-container>

      <ng-container matColumnDef="rol">
        <th mat-header-cell *matHeaderCellDef>ROLES</th>
        <td mat-cell *matCellDef="let element">
          {{ element.rol }}
        </td>
      </ng-container>

      <ng-container matColumnDef="tieneVigencia">
        <th mat-header-cell *matHeaderCellDef>Activo</th>
        <td mat-cell *matCellDef="let element">

          <span
              *ngIf="!element.tieneVigencia"
          >
            <img class="img-logo" src="assets/userAzul.svg" />
          </span>

          <span
              *ngIf="element.tieneVigencia"
          >
            <img class="img-logo" src="assets/userVerde.svg" />
          </span>

        </td>
      </ng-container>

      
      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns"
        [ngClass]="{ headerRow: true }"
      ></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns; index as i"
        [ngClass]="getClassRow(i)"
      ></tr>
    -


    </table>
    <mat-paginator
      #paginator
      [pageSizeOptions]="[25, 50, 100]"
      showFirstLastButtons
    ></mat-paginator>
  </div>
</div>
