
<div class="px-4 py-3 bg-primary-700 flex justify-between text-white font-semibold">
    <span>Asignación de Rol</span>
    <button (click)="onClose()">
      <esp-icon icon="faClose"></esp-icon>
    </button>
  </div>
  <div class="px-4 py-3 bg-white" [formGroup]="form">
    <div class="gap-3 mt-4 mb-2"  >
      <div class="relative mt-2 rounded-md shadow-sm">
        <select formControlName="rol" 
            id="rol"
          class="space-x-5 bg-slate-50 border border-gray-300 text-gray-900 text-sm rounded-lg focusCampo block w-full"
          espEstiloInput>
          <option *ngFor="let opcion of opciones" [value]="opcion.codigo">
            {{opcion.nombre}}
          </option>
        </select>
        <label for="rol" espEstiloLabel>Rol</label>
        <div *ngIf="form.controls.rol.touched && form.controls.rol.invalid">
            <p *ngIf="form.controls.rol.hasError('required')" class="font-medium text-red-500 text-xs mt-1 ml-1">
                Seleccione un tipo de documento
            </p>
        </div>
      </div>
    </div>
    <!--<div style="text-align: center;" class="my-2">
      <span class="px-2.5 pt-2.5 font-semibold" style="color: red; font-size: ;">Se requiere digitar contraseña</span>
    </div>-->
    <hr class="mb-3">
    <div class="flex justify-center space-x-2">
      
      <div class="flex w-100 flex-row gap-2.5">
        <div class="flex flex-col">
          <div class="relative">
            <input
              id="password"
              formControlName="password"
              placeholder="Contraseña"
              [type]="showPassword ? 'text' : 'password'"
              class="w-full rounded bg-white border-gray-400 border-1 px-4 py-3 font-light focusCampo focus:border-1"
              espEstiloInput
            />
            <button
              type="button"
              class="inset-y-0 mr-4 right-0 absolute"
              style="color: rgb(58, 58, 58);"
              (click)="showPassword = !showPassword"
            >
              <esp-icon [icon]="showPassword ? 'faEye' : 'faEyeSlash'"></esp-icon>
            </button>
            <label espEstiloLabel for="password">Contraseña</label>
          </div>
        <div *ngIf="form.controls.password.touched">
            <p *ngIf="form.controls.password.value == null" class="font-medium text-red-500 text-xs mt-1 ml-1">
              N° de Entregables requerido
            </p>
            <p *ngIf="msg" class="font-medium text-red-500 text-xs mt-1 ml-1">
              {{msg}}
            </p>
          </div>
        </div>
      </div>
    </div>

  </div>
  <div class="flex justify-center bg-white py-4">
    <div class="flex gap-2">
      <app-btn (click)="onClose()" color="none" [style]="{'bg-white':true,'hover:bg-gray-100':true,'text-black':true,'shadow-sm':true}">Cancelar</app-btn>
      <app-btn (click)="asignarRol()" [disabled]="statusLogin == 'loading'">
        Registrar
      </app-btn>
    </div>
  </div>
