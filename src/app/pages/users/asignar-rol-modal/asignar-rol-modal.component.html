
<div class="px-4 py-3 bg-primary-700 flex justify-between text-white font-semibold">
    <span>Asignación de Rol</span>
    <button (click)="onClose()">
      <esp-icon icon="faClose"></esp-icon>
    </button>
  </div>
  <div class="px-4 py-3 bg-white">
    <div class="gap-3 mt-4 mb-2" [formGroup]="form" >
      <div class="relative mt-2 rounded-md shadow-sm">
        <select formControlName="frmTipoDoc" 
            id="frmTipoDoc"
          class="space-x-5 bg-slate-50 border border-gray-300 text-gray-900 text-sm rounded-lg focusCampo block w-full"
          espEstiloInput>
          <option *ngFor="let opcion of opciones" [value]="opcion.idRolAplicacion">
            {{opcion.nombre}}
          </option>
        </select>
        <label for="frmTipoDoc" espEstiloLabel>Rol</label>
        <div *ngIf="form.controls.frmTipoDoc.touched && form.controls.frmTipoDoc.invalid">
            <p *ngIf="form.controls.frmTipoDoc.hasError('required')" class="font-medium text-red-500 text-xs mt-1 ml-1">
                Seleccione un tipo de documento
            </p>
        </div>
      </div>
    </div>
  </div>
  <div class="flex justify-center bg-white py-3">
    <div class="flex gap-2">
      <app-btn (click)="onClose()" color="none" [style]="{'bg-white':true,'hover:bg-gray-100':true,'text-black':true,'shadow-sm':true}">Cancelar</app-btn>
      <app-btn  >Registrar</app-btn>
    </div>
  </div>
