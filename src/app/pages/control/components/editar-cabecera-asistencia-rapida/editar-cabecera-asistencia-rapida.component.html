<div>
    <esp-opciones-botones 
    [rutaRegreso]="'/app/control/asistencia-rapida/asistencias/'+idAsisRap" >
    </esp-opciones-botones>
  </div>
  <div class="px-4 py-3 bg-white w-full mt-3 grid botonApariencia" *ngIf="statusLoadingData">
    <div class="text-gray-600 w-full text-center">
        <p class="py-1 font-semibold text-2xl">
            <fa-icon class="mr-2" [icon]="faSpinner" [pulse]="true"></fa-icon>
            Obteniendo datos...
        </p>
    </div>
</div>
<div class="flex flex-col gap-3" *ngIf="!statusLoadingData">
    <div class="flex flex-row gap-3 px-3 botonApariencia bg-white py-1.5">
        <div class="flex flex-col justify-between grow">
            <div class="py-3">
                <div class="flex flex-row gap-2.5">
                    <div class="flex flex-col gap-[5px] shrink-0 w-[160px]">
                        <span class="font-semibold text-[40px] leading-[30px]">
                            <select [(ngModel)]="selectedDay" class="font-semibold text-[40px] leading-[40px] w-[120px]">
                                <option *ngFor="let day of daysInMonth" [value]="day">{{ day }}</option>
                              </select>
                        </span>
                        <span class="font-light leading-[20px]">
                            <div class="flex flex-col gap-[5px] leading-[20px]">
                                <select [(ngModel)]="selectedMonth" (change)="onMonthChange()" class="text-[18px] font-medium" [disabled]="true">
                                  <option *ngFor="let month of getFilteredMonths()" [value]="month.value" [disabled]="month.value < currentMonth">{{ month.name }}</option>
                                </select>
                              </div>
                        </span>
                    </div>
                    <div class="flex flex-row gap-[5px] leading-[20px] w-[720px]">
                      <div class="w-3/5">
                        <label class="block m-0 py-2 text-gray-600 h-[45px]">
                          Seleccione el Servicio
                        </label>
                        <div class="relative w-full">
                          <div class="relative flex items-center">
                            <input
                              type="text"
                              class="inputTextoDialog focusCampo w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none"
                              [formControl]="ctrlSearchServicio"
                              [readonly]="esperaBusqueda"
                              [matAutocomplete]="servicios"
                              [placeholder]="esperaBusqueda ? 'Cargando data...' : 'Seleccione el servicio'"
                              [ngClass]="{'bg-gray-100': esperaBusqueda}"
                            />
                            <button
                              type="button"
                              *ngIf="ctrlSearchServicio.value"
                              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-red-500 focus:outline-none"
                              (click)="clearServicioValue()"
                              style="height: 1.5rem; width: 1.5rem; display: flex; justify-content: center; align-items: center;"
                            >
                              <mat-icon>close</mat-icon>
                            </button>
                          </div>
                        </div>
                      
                        <mat-autocomplete #servicios="matAutocomplete" [displayWith]="displayServicioFiltered" (optionSelected)="onServicioSelect($event)">
                          <mat-option *ngFor="let option of serviciosFiltrados" [value]="option">
                            {{ option.nombre }}
                          </mat-option>
                        </mat-autocomplete>
                      </div>
                      <div class="w-2/5" *ngIf="idRol == 9 && listCiram?.length > 0">
                        <label class="block m-0 py-0 text-gray-600 h-[45px]">
                          Seleccione el CIRAM (Opcional)
                          <mat-icon
                            style="font-size: 15px;"
                            class="text-gray-500 hover:text-blue-500 h-0 py-0 my-0"
                            [matTooltip]="'Al seleccionar un CIRAM, este se configurará como la unidad operativa a la que pertenece el Taller/Actividad'"
                          >
                            help_outline
                          </mat-icon>
                        </label>
                        <div class="relative w-full">
                          <div class="relative flex items-center">
                            <input
                              type="text"
                              class="inputTextoDialog focusCampo w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none"
                              [formControl]="ctrlSearchCiram"
                              [readonly]="esperaBusquedaCiram"
                              [placeholder]="esperaBusquedaCiram ? 'Cargando data...' : 'Seleccione el CIRAM'"
                              [matTooltip]="this.datoProgramacion.tieneAsistencias ? (denominacion+' tiene asistencias registradas, para editar el CIRAM debe eliminar todas las asistencias de '+denominacion) : ''"
                              [matAutocomplete]="ciramsRef"
                              [disabled]="this.datoProgramacion.tieneAsistencias"
                              [ngClass]="{
                                'bg-gray-100 text-gray-500': this.datoProgramacion.tieneAsistencias,
                                'bg-white text-black': !this.datoProgramacion.tieneAsistencias
                              }"
                            />
                            <button
                              type="button"
                              *ngIf="ctrlSearchCiram.value && !this.datoProgramacion.tieneAsistencias"
                              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-red-500 focus:outline-none"
                              (click)="clearCiramValue()"
                              style="height: 1.5rem; width: 1.5rem; display: flex; justify-content: center; align-items: center;"
                            >
                              <mat-icon>close</mat-icon>
                            </button>
                          </div>
                          
                        </div>
                      
                        <mat-autocomplete
                          #ciramsRef="matAutocomplete"
                          [displayWith]="displayCiram"
                          (optionSelected)="onCiramSelected($event)"
                        >
                          <mat-option *ngFor="let option of listCiram" [value]="option"  [disabled]="this.datoProgramacion.tieneAsistencias">
                            {{ option.nombre }}
                          </mat-option>
                        </mat-autocomplete>
                      </div>
                      
                      
                        <span class="text-[14px] font-light mt-2" *ngIf="false">
                            <span class="text-[14px] font-light">
                                Hora Inicio:
                              </span>
                              <input type="time" [formControl]="horaInicioControl" (change)="onHoraInicioChange()" 
                                      [disabled]="true"
                                      [readOnly]="true"
                                     class="border px-2 py-1 rounded" min="07:00" max="18:15" />
                            
                                     <span class="text-[14px] font-light ml-2">
                                        Hora Fin:
                                      </span>
                                      <select [(ngModel)]="horaFin" class="border px-2 py-1 rounded bg-gray-100 w-[200px]"
                                      [disabled]="true"
                                      >
                                        <option *ngFor="let opcion of horasFinOptions" [value]="opcion.valor">
                                          {{ opcion.texto }}
                                        </option>
                                      </select>
                        </span>
                    </div>
                </div>
            </div>
            <div class="py-3 flex justify-center items-center">
                <app-btn class="botonApariencia flex flex-row h-10 w-[160px] transform translate-x-20 text-center" (click)="crearClase()" [disabled]="statusLoadingSave">
                    <div class="flex flex-row items-right gap-[5px] text-center justify-center">
                        <!--<img class="self-center" src="assets/svg/icon-list-assignments.svg">-->
                        <span class="items-center">Editar datos</span> <!-- Texto fijo -->
                    </div>
                </app-btn>
              </div>

        </div>
        <div class="flex flex-col gap-[2px] shrink-0 w-[180px]">
           
          <div class="flex flex-row gap-2 py-[2px]">
              <div class="flex items-center justify-center w-6">
              <img class="select-none" src="assets/svg/cifra.svg">
              </div>
              <div class="flex flex-col text-[#64748B]">
              <input type="number" [(ngModel)]="cifra" min="1" class="text-[13px] leading-4 border border-[#64748B] rounded w-[160px]" />
              <span class="font-light leading-[10px] text-[10px] py-1">Nro de {{descCifra}}</span>
              </div>
          </div>
          <div class="flex flex-row gap-2 py-[2px]">
            <div class="flex items-center justify-center w-6">
            <img class="select-none" src="assets/svg/icon-class-lesson.svg">
            </div>
            <div class="flex flex-col text-[#64748B]">
            <input type="number" [(ngModel)]="sesion" min="1" class="text-[13px] leading-4 border border-[#64748B] rounded w-[160px]" />
            <span class="font-light leading-[10px] text-[10px] py-1">Sesión</span>
            </div>
        </div>
            <div class="flex flex-row gap-2 py-[2px]">
                <div class="flex items-center justify-center w-6">
                <img class="select-none" src="assets/svg/presupuesto.svg">
                </div>
                <div class="flex flex-col text-[#64748B]">
                <select [(ngModel)]="presupuesto" class="text-[13px] leading-4 border border-[#64748B] rounded w-[160px]" [disabled]="true">
                    <option value="PROPIO">PROPIO</option>
                    <option value="COFINANCIADO">COFINANCIADO</option>
                </select>
                <span class="font-light leading-[10px] text-[10px] py-1">Presupuesto</span>
                </div>
            </div>
            <div class="flex flex-row gap-2 py-[2px]">
                <div class="flex items-center justify-center w-6">
                <img class="iconoEscalaGris select-none" src="assets/svg/modalidad.svg">
                </div>
                <div class="flex flex-col text-[#64748B]">
                <select [(ngModel)]="modalidad" class="text-[13px] leading-4 border border-[#64748B] rounded w-[160px]">
                    <option value="PRESENCIAL">PRESENCIAL</option>
                    <option value="VIRTUAL">VIRTUAL</option>
                </select>
                <span class="font-light leading-[10px] text-[10px] py-1">Modalidad</span>
                </div>
            </div>
