<div  class="botonApariencia">
    <div class="px-4 py-3 bg-cam flex justify-between text-white rounded-t-md">
        <span>Confirmar Asistencia</span>
        <button (click)="onClose()"><esp-icon icon="faClose"></esp-icon></button>
    </div>
    
    <div class="bg-white flex flex-col text-[#37474F]">
        <div class="py-4">
            <div class="py-2.5">
                <div class="flex flex-col items-center gap-2.5 p-2.5 text-center leading-5">
                    <img class="h-[150px]" src='data:image/jpeg;base64,{{dataAsegurado.foto}}'>
                    <span>{{dataAsegurado.nombreCompleto | titlecase}}</span>
                    <span>{{dataAsegurado.tipoDoc === 'DNI' ? dataAsegurado.tipoDoc : dataAsegurado.tipoDoc | titlecase}} {{dataAsegurado.numDoc}}</span>
                    <span *ngIf="!dataAsegurado.acreditacion" class="text-red-500 text-center whitespace-pre-line">{{data.infoAsegurado.message | titlecase}}</span>
                </div>
            </div>
        </div>
        <div class="flex flex-row gap-2 justify-center pt-6 pb-3 px-4 border-t border-[#F4F5F5]">
          <div class="w-1/2 text-wright">
            <div class="w-fit">
              <app-btn class="botonApariencia flex" color="white" (click)="onClose()">Cancelar
              </app-btn>
            </div>
          </div>
          <div class="w-1/2">
            <div class="w-fit">
              <app-btn class="botonApariencia flex" type="submit" color="mezclado" [loading]="status === 'loading'" (click)="registrar()">Registrar
              </app-btn>
            </div>
          </div>
        </div>
    </div>
</div>
