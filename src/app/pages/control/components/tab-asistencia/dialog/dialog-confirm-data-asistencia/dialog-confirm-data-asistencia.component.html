<div  class="botonApariencia">
    <div class="px-4 py-3 bg-cam flex justify-between text-white rounded-t-md">
        <span>Confirmar Asistencia</span>
        <button (click)="onClose()"><esp-icon icon="faClose"></esp-icon></button>
    </div>
    
    <div class="bg-white flex flex-col text-[#37474F]">
        <div class="py-4">
            <div class="py-2.5">
                <div class="flex flex-col items-center gap-2.5 p-2.5 text-center leading-5">
                    <img class="h-[150px]" src='data:image/jpeg;base64,{{data.infoAsegurado.foto}}'>
                    <span>{{data.infoAsegurado.nombreCompleto | titlecase}}</span>
                    <span>{{data.infoAsegurado.tipoDoc === 'DNI' ? data.infoAsegurado.tipoDoc : data.infoAsegurado.tipoDoc | titlecase}} {{data.infoAsegurado.numDoc}}</span>
                </div>
            </div>
        </div>
    </div>
</div>
