<div class="info-container flex items-center mt-2">
    <div class="flex justify-start mt-6"><app-btn class="botonApariencia flex" type="submit" color="mezclado"
            (click)="grabarDatosPersonales()">
            hoy
        </app-btn>
    </div>
    <div class="flex justify-start mt-6 ml-4"><app-btn class="botonApariencia flex" type="submit" color="white"
            (click)="grabarDatosPersonales()">
            Mañana
        </app-btn>
    </div>
    <div class="flex justify-start mt-6 ml-4"><app-btn class="botonApariencia flex" type="submit" color="white"
            (click)="grabarDatosPersonales()">
            Esta semana
        </app-btn>
    </div>
    <div class="flex justify-start mt-6 ml-4"><app-btn class="botonApariencia flex" type="submit" color="white"
            (click)="grabarDatosPersonales()">
            La Proxima Semana
        </app-btn>
    </div>
    <div class="flex justify-start mt-6 ml-4"><app-btn class="botonApariencia flex" type="submit" color="white"
            (click)="grabarDatosPersonales()">
            Este Mes
        </app-btn>
    </div>
    <div class="flex justify-start mt-6 ml-4"><app-btn class="botonApariencia flex" type="submit" color="white"
            (click)="grabarDatosPersonales()">
            El proximo mes
        </app-btn>
    </div>
</div>
<div class="mt-4">
    <div *ngFor="let prog of ListaProgramacines" class="info-container flex items-center">
        <div class="w-1/3 mr-4">
            <div class="p-4 bg-white shadow-lg">
                <div class="info-container flex">
                    <div>
                        <div class="text-lg font-bold text-xl mr-4">{{prog.fecha.split("-")[2]}}</div>
                        <div class="text-lg text-xs mr-4">{{getMes(prog.fecha)}}</div>
                    </div>

                    <div>
                        <div class="text-sm font-semibold"> TALLER DE {{prog.nombre}}</div>
                        <div class="text-gray-600 text-xs"> {{formatoFecha(prog.fecha)}} de {{prog.horaInicio}} -
                            {{prog.horaFin}}</div>
                        <div class="text-gray-600 text-xs">CAM {{prog.nombreCam}}</div>
                        <div class="text-indigo-500 text-xs">{{prog.distrito}}</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
