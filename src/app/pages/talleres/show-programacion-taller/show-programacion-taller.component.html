<div *ngIf="false && this.uo">
{{ this.uo.descripcion }}
</div>

<div class="block pl-3 pt-3" *ngIf="this.uo">
      <p class="text-slate-600 uppercase text-s-20 font-semibold">
        talleristas 
      </p>
      <span class=" text-s-11 text-slate-400">
        {{this.uo.descripcion }}
      </span>
    </div>
    <div class="flex bg-slate-100 p-2 m-2">
      <div class="w-70 flex">
        <div class="flex items-center bg-white">
          <div class="">
            <mat-date-range-picker #picker></mat-date-range-picker>
          </div>
          <div class="">
            <mat-date-range-input
              [formGroup]="range"
              [rangePicker]="picker"
              class="ml-3 p-2"
            >
              <input
                matStartDate
                formControlName="start"
                placeholder="Fecha de inicio"
                class="ml-2"
              />
              <input
                matEndDate
                formControlName="end"
                placeholder="Fecha de fin"
              />
            </mat-date-range-input>
          </div>
          <div class="">
            <mat-datepicker-toggle
              matIconSuffix
              [for]="picker"
            ></mat-datepicker-toggle>
          </div>
          <mat-error
            *ngIf="range.controls.start.hasError('matStartDateInvalid')"
            >Invalid start date</mat-error
          >
          <mat-error *ngIf="range.controls.end.hasError('matEndDateInvalid')"
            >Invalid end date</mat-error
          >
        </div>
      </div>
      <div class="w-30 space-x-2 flex justify-end">
        <div>
          <select
            id="countries"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
          >
            <option selected>TODOS</option>
            <option value="1">SOLO DISPONIBLES</option>
            <option value="2">SOLO NO DISPONIBLES</option>
          </select>
        </div>

        <button mat-raised-button class="text-uppercase mat-btn-primary" routerLink="./asignar-tallerista">
          agregar
        </button>
      </div>
    </div>
    <div class="m-2">
      <table mat-table [dataSource]="dataSource">
        <ng-container matColumnDef="nombres" class="">
          <th mat-header-cell *matHeaderCellDef class="">DNI</th>
          <td
            mat-cell
            *matCellDef="let element"
            class="justify-left"
            style="align-content: start"
          >
            <a
              class="decorator-none text-primary3 text-w-semibold"
            >
              {{ element.usuario }}
            </a>
          </td>
        </ng-container>

        <ng-container matColumnDef="usuario">
          <th mat-header-cell *matHeaderCellDef>Nombres</th>
          <td mat-cell *matCellDef="let element">
            {{ element.nombres }}
          </td>
        </ng-container>

        <ng-container matColumnDef="cam">
          <th mat-header-cell *matHeaderCellDef>CAM</th>
          <td mat-cell *matCellDef="let element">CAM ALMENARA</td>
        </ng-container>

        <ng-container matColumnDef="rol">
          <th mat-header-cell *matHeaderCellDef>ROLES</th>
          <td mat-cell *matCellDef="let element">
            {{ element.rol }}
          </td>
        </ng-container>

        <ng-container matColumnDef="tieneVigencia">
          <th mat-header-cell *matHeaderCellDef>Activo</th>
          <td mat-cell *matCellDef="let element">
            <span *ngIf="!element.tieneVigencia">
              <img class="img-logo" src="assets/userAzul.svg" />
            </span>

            <span *ngIf="element.tieneVigencia">
              <img class="img-logo" src="assets/userVerde.svg" />
            </span>
          </td>
        </ng-container>

        <tr
          mat-header-row
          *matHeaderRowDef="displayedColumns"
          [ngClass]="{ headerRow: true }"
        ></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns; index as i"
          [ngClass]="getClassRow(i)"
        ></tr>
        -
      </table>
    </div>
